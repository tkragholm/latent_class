[package]
name = "latent_class"
version = "0.1.0"
edition = "2024"
authors = ["Tobias Kragholm"]
license = "MIT OR Apache-2.0"
description = "Latent class analysis of binary indicators by EM with parallel random restarts"

[dependencies]
faer = { version = "0.24.0", features = ["nightly", "perf-warn"] }
epistat-optim = { git = "https://github.com/tkragholm/epistat", rev = "a6068fe6d8eece35b88aa71866f449c2aa8ab62a", features = ["rayon"] }
epistat-rng = { git = "https://github.com/tkragholm/epistat", rev = "a6068fe6d8eece35b88aa71866f449c2aa8ab62a", features = ["rand"] }
rand_distr = { version = "0.6.0", default-features = false }
serde = { version = "1.0.228", features = ["serde_derive"], default-features = false }
thiserror = { version = "2.0.18", default-features = false }
cgp = "0.7.0"
camino = "1.1.9"
csv = "1.4.0"

[dev-dependencies]
approx = { version = "0.5.1", default-features = false }
rstest = { version = "0.26", default-features = false }
proptest = { version = "1.6.0", features = ["std"], default-features = false }
criterion = { version = "0.8.2", default-features = false }
tempfile = { version = "3", default-features = false }
serde_json = { version = "1.0.145", default-features = false }

[[bench]]
name = "em_convergence"
harness = false
