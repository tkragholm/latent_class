[package]
name = "latent_class"
version = "0.1.0"
edition = "2024"
authors = ["Tobias Kragholm"]
license = "MIT OR Apache-2.0"

[dependencies]
faer = { version = "0.24.0", features = ["nightly", "perf-warn"] }
rayon = "1.11.0"
rand = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
cgp = "0.7.0"
camino = { version = "1.1.9", features = ["serde1"] }
csv = "1.4.0"

[dev-dependencies]
approx = "0.5.1"
rstest = "0.26"
proptest = "1.6.0"
criterion = { version = "0.8.2", default-features = false }
rand_chacha = "0.10.0"
tempfile = "3"
serde_json = "1.0.145"

[[bench]]
name = "em_convergence"
harness = false
